# Omni echo cancellation (installed to ~/.config/pipewire/pipewire.conf.d/ by install.py).
#
# Omni plays speech into omni-echo-cancel-sink and listens on omni-echo-cancel-source.
# WebRTC subtracts what went into the sink from what the mic hears, so Omni does not
# hear itself. Only Omni uses these nodes: the default devices and other apps are untouched.
# Sound from other apps is not cancelled, so a person talking still gets through.
#
# install.py fills in the devices from echo_cancel_mic and echo_cancel_speaker in
# ~/.config/omni/config.toml (node names from `wpctl status` or `pw-cli ls Node`).
context.modules = [
  { name = libpipewire-module-echo-cancel
    args = {
      library.name = aec/libspa-aec-webrtc
      audio.channels = 1
      audio.position = [ MONO ]
      capture.props = {
        node.name = "omni-echo-cancel-capture"
        target.object = "@MIC@"
        node.passive = true
      }
      source.props = {
        node.name = "omni-echo-cancel-source"
        node.description = "Omni mic (echo cancelled)"
        priority.session = 0
      }
      sink.props = {
        node.name = "omni-echo-cancel-sink"
        node.description = "Omni speech (echo cancelled)"
        priority.session = 0
      }
      playback.props = {
        node.name = "omni-echo-cancel-playback"
        target.object = "@SPEAKER@"
        node.passive = true
      }
    }
  }
]
